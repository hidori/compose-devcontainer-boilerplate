# serena 本体と Python の言語サーバー（basedpyright）の依存関係（uv.lock で固定する）
[project]
name = "mcp-serena"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  "basedpyright==1.39.9",
  "serena-agent==2.1.0",
]

[tool.uv]
package = false
# serena-agent 2.1.0 が固定している版に脆弱性があり、修正版（パッチ版）に上書きする（uv audit で検出）
# - werkzeug 3.1.7: PYSEC-2026-4312（safe_join() が Windows の特殊なデバイス名を通す）
override-dependencies = [
  "werkzeug==3.1.9",
]
