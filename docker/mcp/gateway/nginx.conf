# 非 root（compose の user: "100:101"）で動かすため、pid と一時ファイルを /tmp 配下に置く
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # 上流は Docker 内蔵 DNS で実行時に名前解決する
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SSE 応答への対応（conf.d/ の MCP エンドポイントの location はすべてこれを継承する）
    proxy_http_version 1.1;
    proxy_buffering off;

    # DNS rebinding 対策: Host はホスト名のみ検査する（$host はポート番号を含まない）
    map $host $mcp_host_allowed {
        default 0;
        localhost 1;
        127.0.0.1 1;
        host.docker.internal 1;
    }

    # DNS rebinding 対策: Origin はヘッダーがなければ許可、あれば localhost / 127.0.0.1 のみ許可する
    map $http_origin $mcp_origin_allowed {
        default 0;
        "" 1;
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" 1;
    }

    server {
        listen 8080;
        server_name _;

        if ($mcp_host_allowed = 0) {
            return 403;
        }
        if ($mcp_origin_allowed = 0) {
            return 403;
        }

        location = /gateway/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 許可リスト外のパスは静的ファイルを探さずに 404 を返す
        location / {
            return 404;
        }

        # MCP サーバーごとの location（/<id>/mcp）
        include /etc/gateway/conf.d/*.conf;
    }
}
