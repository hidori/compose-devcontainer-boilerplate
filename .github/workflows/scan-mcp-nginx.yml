---
name: scan-mcp-nginx

"on":
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 9:00（JST）
  workflow_dispatch:
  pull_request:
    paths:
      - docker/mcp/gateway/**
      - scripts/osv-summary.py
      - Makefile
      - compose.yaml
      - mise.toml
      - .github/workflows/scan-mcp-nginx.yml
      - .github/actions/setup-compose/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-compose
      # v5.2.5
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195
      - run: make scan-mcp-nginx
